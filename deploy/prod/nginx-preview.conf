# Loopback-only preview of v2 BEFORE cutover (reach it with ssh -L 8180/8181).
server {
    listen 127.0.0.1:8180;
    root /opt/nhg-manabi-v2/web/current;
    include /opt/nhg-manabi-v2/nginx/web-locations.inc;
}
server {
    listen 127.0.0.1:8181;
    root /opt/nhg-manabi-v2/admin/current;
    include /opt/nhg-manabi-v2/nginx/admin-locations.inc;
}
