# v2 admin site (admin.manabi.cc). Replaces V1's nhg-manabi-admin at cutover.
server {
    listen 80;
    listen [::]:80;
    server_name admin.manabi.cc;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://admin.manabi.cc$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.manabi.cc;

    ssl_certificate /etc/letsencrypt/live/admin.manabi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.manabi.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /opt/nhg-manabi-v2/admin/current;
    client_max_body_size 1m;

    include /opt/nhg-manabi-v2/nginx/admin-locations.inc;
}
